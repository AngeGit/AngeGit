<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 434 104" width="434" height="104" role="img" aria-labelledby="t"><title id="t">Open the Howler: my story, read it or hear it in my voice</title>
<defs>
 <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="118" y1="0" x2="420" y2="0"><stop class="r1" offset="0"/><stop class="r2" offset="1"/></linearGradient>
 <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ef4444"/><stop offset="1" stop-color="#991b1b"/></linearGradient>
 <filter id="glow" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<style>@font-face{font-family:'Oxanium';src:url(data:font/woff2;base64,) format('woff2');font-weight:100 900}@font-face{font-family:'JBMono';src:url(data:font/woff2;base64,) format('woff2');font-weight:100 900}
.l{font:700 20px 'Oxanium',sans-serif;letter-spacing:2px}.s{font:600 12px 'JBMono',monospace}
.shake{transform-origin:64px 56px;animation:shake 4.5s ease-in-out infinite}
@keyframes shake{0%,78%,100%{transform:rotate(0)}80%{transform:rotate(-7deg)}82%{transform:rotate(6deg)}84%{transform:rotate(-5deg)}86%{transform:rotate(4deg)}88%{transform:rotate(-2deg)}90%{transform:rotate(0)}}
.puff{animation:puff 4.5s ease-out infinite;opacity:0}
@keyframes puff{0%,80%{opacity:0;transform:translateY(0)}86%{opacity:.9}100%{opacity:0;transform:translateY(-14px)}}
.r1{stop-color:#dc2626}.r2{stop-color:#ea580c}.tglow{display:none}@media (prefers-color-scheme:dark){.r1{stop-color:#ef4444}.r2{stop-color:#fb923c}.tglow{display:inline}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<g class="shake">
 <rect x="26" y="30" width="76" height="52" rx="6" fill="url(#paper)"/>
 <path d="M28 34 L64 62 L100 34" fill="none" stroke="#7f1d1d" stroke-width="2.5" stroke-linejoin="round"/>
 <path d="M28 80 L54 56 M100 80 L74 56" stroke="#7f1d1d" stroke-width="1.5" opacity=".55"/>
 <circle cx="64" cy="61" r="9" fill="#fbbf24"/><circle cx="64" cy="61" r="6.5" fill="#b45309"/>
 <path d="M60.5 58v6M67.5 58v6M60.5 61h7" stroke="#fde68a" stroke-width="1.6" stroke-linecap="round"/>
</g>
<g fill="#fb923c"><circle class="puff" cx="44" cy="26" r="2.5"/><circle class="puff" style="animation-delay:.15s" cx="84" cy="24" r="2"/><path class="puff" style="animation-delay:.3s" d="M64 16C64.56 19.44 64.56 19.44 68 20C64.56 20.56 64.56 20.56 64 24C63.44 20.56 63.44 20.56 60 20C63.44 19.44 63.44 19.44 64 16Z"/></g>
<text class="l tglow" x="118" y="50.0" fill="url(#ink)" opacity=".55" filter="url(#glow)">OPEN THE HOWLER</text>
<text class="l" x="118" y="50.0" fill="url(#ink)">OPEN THE HOWLER</text>
<text class="s" x="118" y="72.0" fill="url(#ink)">my story · read it, or hear it in my voice</text>
