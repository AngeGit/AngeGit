<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 488" width="340" height="488" role="img" aria-labelledby="t"><title id="t">Welcome to my (code) chamber of secrets. I'm Ángeles, Angie for short: an Android and Kotlin Multiplatform developer based in Madrid, with 5+ years of shipping real apps. By day I build with Kotlin and Compose on an app used by millions of shoppers, where a bug in the checkout is never a small bug. Day and night, I also build the wards that keep AI coding agents honest: specs they must follow, gates they can't charm their way past, and evidence behind every “tests pass”, at work and at home. I wrote you a Howler with the rest of the story, just below. Don't worry: it's a polite one. Almost.</title>
