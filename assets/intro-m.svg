<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 438" width="340" height="438" role="img" aria-labelledby="t"><title id="t">Welcome to my (code) chamber of secrets. I'm Ángeles, Angie for short: an Android and Kotlin Multiplatform developer based in Madrid, with 5+ years of shipping real apps. By day I build with Kotlin and Compose on an app used by millions of shoppers, where no checkout bug is ever small. I also build tooling that keeps AI coding agents honest, at work and at home: specs to follow and quality gates they can't skip. I wrote you a Howler with the rest of the story, just below. Don't worry: it's a polite one. Almost.</title>
