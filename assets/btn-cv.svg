<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 245 58" width="245" height="58" role="img" aria-label="Unroll The Scroll: CV · PDF download">
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#e879f9"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
<filter id="glow" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="3"/></filter></defs>
<style>@font-face{font-family:'Oxanium';src:url(data:font/woff2;base64,) format('woff2');font-weight:100 900}@font-face{font-family:'JBMono';src:url(data:font/woff2;base64,) format('woff2');font-weight:100 900}
.l{font:700 15px 'Oxanium',sans-serif;letter-spacing:1.5px}.s{font:500 11.5px 'JBMono',monospace}.e{font:20px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.pulse{animation:p 3s ease-in-out infinite}@keyframes p{50%{stroke-opacity:.5}}.bg{fill:#fff}.l{fill:#3b1446}.s{fill:#6b5b7b}.halo{opacity:.35}@media (prefers-color-scheme:dark){.bg{fill:#0b0816}.l{fill:#f6f0ff}.s{fill:#c4b5fd}.halo{opacity:.75}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect class="bg" x="3" y="3" width="239" height="52" rx="12"/>
<rect class="halo" x="3" y="3" width="239" height="52" rx="12" fill="none" stroke="url(#g)" stroke-width="3" filter="url(#glow)"/>
<rect class="pulse" x="3" y="3" width="239" height="52" rx="12" fill="none" stroke="url(#g)" stroke-width="2"/>
<text class="e" x="18" y="36.0">📜</text>
<text class="l" x="52" y="27.0">UNROLL THE SCROLL</text>
<text class="s" x="52" y="43.0">CV · PDF download</text>
</svg>