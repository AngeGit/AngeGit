="M13 227C13.84 232.16 13.84 232.16 19 233C13.84 233.84 13.84 233.84 13 239C12.16 233.84 12.16 233.84 7 233C12.16 232.16 12.16 232.16 13 227Z"/><text class="p" x="32" y="238" xml:space="preserve"><tspan class="hl">Clarity</tspan> <tspan class="hl">above</tspan> <tspan class="hl">all.</tspan> Code is read far more often than it's written: by my team, by future me,</text><text class="p" x="32" y="262" xml:space="preserve">and now by agents too.</text><path class="bul" d="M13 285C13.84 290.16 13.84 290.16 19 291C13.84 291.84 13.84 291.84 13 297C12.16 291.84 12.16 291.84 7 291C12.16 290.16 12.16 290.16 13 285Z"/><text class="p" x="32" y="296" xml:space="preserve"><tspan class="hl">Agents</tspan> <tspan class="hl">earn</tspan> <tspan class="hl">their</tspan> <tspan class="hl">merges.</tspan> Spec → contracts → code → gates → PR. No receipt, no “tests pass”.</text>

