<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 306" width="860" height="306" role="img" aria-labelledby="t"><title id="t">Clean and modular code from the very first incantation. Architecture that keeps the balance. Clean Architecture, SOLID and MVI, with layer rules enforced by tests, not by code-review mood. Testing potions for safe experiments. Turbine for Flows, virtual time for coroutines, and fakes or mocks, whichever fits the test. Modular by design. Pure commonMain, platform code behind expect/actual, and convention plugins so many modules build like one. Clarity above all. Code is read far more often than it's written: by my team, by future me, and now by agents too. Agents earn their merges. Spec → contracts → code → gates → PR. No receipt, no “tests pass”.</title>
