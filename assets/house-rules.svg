="M13 243C13.84 248.16 13.84 248.16 19 249C13.84 249.84 13.84 249.84 13 255C12.16 249.84 12.16 249.84 7 249C12.16 248.16 12.16 248.16 13 243Z"/><text class="p" x="32" y="254" xml:space="preserve"><tspan class="hl">Clarity</tspan> <tspan class="hl">above</tspan> <tspan class="hl">all.</tspan> Code is read far more often than it's written: by my team, by</text><text class="p" x="32" y="280" xml:space="preserve">future me, and now by agents too.</text><path class="bul" d="M13 305C13.84 310.16 13.84 310.16 19 311C13.84 311.84 13.84 311.84 13 317C12.16 311.84 12.16 311.84 7 311C12.16 310.16 12.16 310.16 13 305Z"/><text class="p" x="32" y="316" xml:space="preserve"><tspan class="hl">Agents</tspan> <tspan class="hl">earn</tspan> <tspan class="hl">their</tspan> <tspan class="hl">merges.</tspan> Spec → contracts → code → gates → PR. No receipt, no “tests</text><text class="p" x="32" y="342" xml:space="preserve">pass”.</text>

